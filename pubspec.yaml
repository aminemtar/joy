name: joy
description: Thirty-six offline party games for one to four players.
publish_to: none
version: 1.4.0+6
environment:
  sdk: '>=3.7.0 <4.0.0'
dependencies:
  web: ^1.1.1
  audioplayers: ^6.8.1
  flutter:
    sdk: flutter
  shared_preferences: ^2.5.3
dev_dependencies:
  audioplayers_platform_interface: ^7.2.0
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/art/game_atlas.png
    - assets/art/strategy_atlas.png
    - assets/art/app_icon.png
    - assets/audio/
