name: joy
description: Thirty-six offline games for two players on one screen.
publish_to: none
version: 1.2.0+3
environment:
  sdk: '>=3.7.0 <4.0.0'
dependencies:
  audioplayers: ^6.8.1
  flutter:
    sdk: flutter
  shared_preferences: ^2.5.3
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/art/game_atlas.png
    - assets/art/strategy_atlas.png
    - assets/art/app_icon.png
    - assets/audio/
